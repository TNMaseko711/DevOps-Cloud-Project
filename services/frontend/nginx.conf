server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location /ready {
    return 200 'ready';
    add_header Content-Type text/plain;
  }

  location / {
    try_files $uri /index.html;
  }
}
